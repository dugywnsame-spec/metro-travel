<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="1~5호선 역 이름을 타자로 치며 달리는 3D 지하철 타이핑 게임. 친구와 실시간 레이스와 랭킹.">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px/1.5 system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>지하철 타이핑 여행</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
/* Layout: full-screen 3D cab view through a glowing subway tunnel; a soft glass station sign + route map floats on top; the typing card hovers under it; station mini-games open as rounded sheets. Single dark world by design. */
:root{
  --night:#070a0e;
  --sign:#f7f9f8;
  --ink:#12171c;
  --soft:#e8edeb;
  --line:#00a84d;
  --line-hi:#5fdc98;
  --line-deep:#007a38;
  --amber:#ffbf3c;
  --red:#ff6159;
  --mute:#93a0a8;
  --glass:rgba(16,22,28,.62);
  --glass-line:rgba(255,255,255,.09);
  --f-display:"Noto Sans KR",system-ui,-apple-system,sans-serif;
  --f-body:"Noto Sans KR",system-ui,-apple-system,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --r-lg:22px;--r-md:14px;--r-sm:10px;
  --ease:cubic-bezier(.22,1,.36,1);
  color-scheme:dark;
}
html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--night);color:var(--sign);font-family:var(--f-body);overflow:hidden;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
#stage{position:fixed;inset:0;background:radial-gradient(ellipse at 50% 42%,#1b2430,#05070a 72%)}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block}
#stage::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 48%,transparent 50%,rgba(0,0,0,.5) 100%)}

#ui{position:absolute;inset:0;display:flex;flex-direction:column;gap:10px;pointer-events:none;
  padding-top:max(12px,env(safe-area-inset-top,0px));padding-bottom:max(12px,env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* HUD */
.hud{display:flex;gap:8px;align-items:stretch;flex-wrap:wrap;max-width:900px;width:100%;margin-inline:auto}
.sign{flex:1 1 320px;min-width:0;background:rgba(247,249,248,.94);color:var(--ink);border-radius:var(--r-lg);overflow:hidden;box-shadow:0 12px 40px rgba(0,0,0,.35),inset 0 0 0 1px rgba(255,255,255,.6);backdrop-filter:blur(10px)}
.sign-top{display:flex;align-items:center;gap:8px;padding:9px 16px 0;font-size:12px;font-weight:700;color:#4d5a62}
.badge{width:22px;height:22px;border-radius:50%;background:var(--line);display:grid;place-items:center;font-weight:900;font-size:12px;color:#fff;flex:none;box-shadow:0 2px 8px color-mix(in srgb,var(--line) 45%,transparent)}
.sign-top .dir{margin-left:auto;color:#7a868d;font-weight:500;white-space:nowrap}
.sign-main{display:flex;align-items:baseline;gap:10px;padding:2px 16px 0}
.sign-main .lbl{font-size:12px;color:var(--line-deep);font-weight:900;letter-spacing:.06em;white-space:nowrap}
.sign-main b{font-family:var(--f-display);font-weight:900;font-size:clamp(24px,6vw,34px);letter-spacing:-.02em;line-height:1.2;text-wrap:balance;transition:opacity .3s}
.route{position:relative;height:38px;margin:2px 24px 8px}
.route .rail{position:absolute;left:0;right:0;top:12px;height:5px;background:var(--line);border-radius:99px;opacity:.9}
.route .dot{position:absolute;top:8px;width:13px;height:13px;margin-left:-6.5px;border-radius:50%;background:#fff;border:3px solid var(--line);box-sizing:border-box;transition:background .4s}
.route .dot.passed{background:var(--line)}
.route .dot.xfer{border-color:var(--ink);box-shadow:0 0 0 2px #fff}
.route .nm{position:absolute;top:24px;transform:translateX(-50%);font-size:11px;white-space:nowrap;color:#5d676e;font-weight:700;display:none}
.route .nm.cur{display:block;color:var(--ink)}
.route .train{position:absolute;top:-1px;width:30px;height:14px;margin-left:-15px;border-radius:8px 8px 4px 4px;background:linear-gradient(180deg,#ffd36b,var(--amber));box-shadow:0 3px 10px rgba(255,170,30,.55),0 0 0 2px #fff;transition:left .6s var(--ease)}
.route .train::before{content:"";position:absolute;left:6px;right:6px;top:3px;height:4px;background:rgba(18,23,28,.8);border-radius:2px}

.stats{display:flex;gap:6px;flex:0 1 auto;flex-wrap:wrap}
.stat{background:var(--glass);border:1px solid var(--glass-line);border-radius:var(--r-md);padding:7px 14px;display:flex;flex-direction:column;justify-content:center;min-width:66px;backdrop-filter:blur(12px)}
.stat span{font-size:11px;color:var(--mute);letter-spacing:.04em}
.stat b{font-family:var(--f-mono);font-size:20px;color:var(--amber);font-variant-numeric:tabular-nums;line-height:1.25;transition:transform .2s var(--ease)}
.stat b.bump{transform:scale(1.18)}
.stat.combo b{color:var(--line-hi)}
.toggles{display:flex;flex-direction:column;gap:4px}
.iconbtn.home-hud{background:rgba(255,255,255,.92);color:#14191d;border-color:#fff}
#homeAsk{position:fixed;inset:0;z-index:80;display:grid;place-items:center;background:rgba(4,7,10,.55);backdrop-filter:blur(6px);animation:fadeIn .2s}
#homeAsk[hidden]{display:none}
#homeAsk .ha{background:#f6f8f7;color:#14191d;border-radius:20px;padding:22px 22px 18px;width:min(360px,calc(100vw - 32px));box-shadow:0 24px 60px rgba(0,0,0,.45);text-align:center}
#homeAsk h3{margin:0 0 6px;font:900 20px var(--f-body)}#homeAsk p{margin:0 0 16px;color:#56626a;font-size:13.5px;line-height:1.5}
#homeAsk .row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tabs2.three{grid-template-columns:1fr 1fr auto}
.tabs2 .rnd{padding:9px 12px;background:#14191d;color:#fff;border-color:#14191d}
.tabs2 .rnd:hover{background:#2a3238}
.routeopt.spin{outline:3px solid var(--amber);outline-offset:1px}
.iconbtn{pointer-events:auto;background:var(--glass);border:1px solid var(--glass-line);color:var(--sign);border-radius:99px;padding:0 12px;font:700 11.5px var(--f-body);cursor:pointer;min-height:30px;flex:1;backdrop-filter:blur(12px);transition:background .2s,color .2s}
.iconbtn[aria-pressed="false"]{color:var(--mute);background:rgba(16,22,28,.4)}
@media (max-width:520px){.stats{flex:1 1 100%}.stat{flex:1;min-width:0;padding:6px 10px}.toggles{flex-direction:row;flex:1 1 100%}.iconbtn{min-height:34px}}

/* LED board */
#led{align-self:center;max-width:min(700px,100%);font-family:var(--f-mono);font-weight:700;color:var(--amber);background:rgba(20,13,3,.78);border:1px solid rgba(255,190,60,.18);padding:7px 16px;border-radius:99px;text-shadow:0 0 10px rgba(255,180,40,.6);font-size:12.5px;letter-spacing:.02em;text-align:center;line-height:1.5;backdrop-filter:blur(8px)}

/* Typing card */
#typebox{box-sizing:border-box;pointer-events:auto;align-self:center;width:min(560px,100%);background:var(--glass);border:1px solid var(--glass-line);border-radius:var(--r-lg);padding:14px 16px 16px;display:flex;flex-direction:column;gap:10px;backdrop-filter:blur(16px) saturate(1.2);box-shadow:0 20px 50px rgba(0,0,0,.4)}
#prompt{font-size:12.5px;color:#b9c4ca;text-align:center}
#word{font-family:var(--f-display);font-weight:900;font-size:clamp(34px,9.5vw,56px);letter-spacing:-.03em;text-align:center;color:#fff;line-height:1.18;word-break:keep-all;overflow-wrap:anywhere;min-height:1.18em}
#word.pop{animation:pop .32s var(--ease)}
@keyframes pop{from{transform:translateY(8px) scale(.94);opacity:.2}to{transform:none;opacity:1}}
#word .ok{color:var(--line-hi);text-shadow:0 0 18px color-mix(in srgb,var(--line-hi) 45%,transparent)}
#word.golden{color:var(--amber);text-shadow:0 0 24px rgba(255,191,60,.45)}
#word.golden .ok{color:#fff3c4}
#word.idle{color:#66727a;font-size:clamp(24px,6vw,32px);font-weight:700}
.tag{align-self:center;font-size:11px;font-weight:900;letter-spacing:.06em;color:var(--ink);background:linear-gradient(90deg,#ffd76e,var(--amber));padding:3px 10px;border-radius:99px}
.segbar{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--mute);font-variant-numeric:tabular-nums}
.segbar .track{flex:1;height:4px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden}
.segbar .track i{display:block;height:100%;width:0;background:var(--line-hi);border-radius:99px;transition:width .35s var(--ease)}
.tbar{height:6px;background:rgba(255,255,255,.1);border-radius:99px;overflow:hidden}
.tbar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#ffd76e,var(--amber));border-radius:99px;transform-origin:left;transform:scaleX(1)}
.tbar i.low{background:linear-gradient(90deg,#ff8a7a,var(--red))}
#typeForm,.mg-form{display:flex;gap:8px}
#typeIn,.mg-input{flex:1;min-width:0;font:500 20px var(--f-body);padding:11px 14px;border-radius:var(--r-md);border:1.5px solid rgba(255,255,255,.12);background:rgba(5,8,11,.55);color:#fff;outline:none;transition:border-color .2s,box-shadow .2s}
.inwrap{position:relative;flex:1;min-width:0;display:flex}
#typeIn{color:transparent;caret-color:transparent;width:100%}
#typeIn::selection{background:transparent}
.inview{position:absolute;inset:0;padding:0 15.5px;display:flex;align-items:center;pointer-events:none;font:500 20px var(--f-body);color:#fff;white-space:pre;overflow:hidden}
.inview .ph{color:#5f6b72}
.inview .tx.bad{color:var(--red)}
.inview .caret{display:none;width:2px;height:1.2em;background:var(--line-hi);margin-left:1px;border-radius:1px;animation:blink 1s steps(2) infinite}
.inwrap:focus-within .inview .caret{display:block}
.inwrap:focus-within .inview .ph{order:2;margin-left:6px}
@keyframes blink{50%{opacity:0}}
#typeIn:focus,.mg-input:focus{border-color:var(--line-hi);box-shadow:0 0 0 4px color-mix(in srgb,var(--line) 25%,transparent)}
.btn{font:700 15.5px var(--f-body);padding:11px 20px;border-radius:var(--r-md);border:0;background:var(--ink);color:#fff;cursor:pointer;min-height:46px;transition:transform .15s var(--ease),filter .2s}
.btn:active{transform:scale(.97)}
.btn:hover{filter:brightness(1.08)}
.btn.go{background:linear-gradient(180deg,var(--line-hi),var(--line));box-shadow:0 6px 18px color-mix(in srgb,var(--line) 35%,transparent)}
.btn:focus-visible,.iconbtn:focus-visible,.card:focus-visible,.hole:focus-visible,.tile:focus-visible,.cbtn:focus-visible,.lineopt:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
#fb{min-height:1.4em;text-align:center;font-size:13.5px;font-weight:700;transition:color .2s}
#fb.good{color:var(--line-hi)} #fb.bad{color:var(--red)}
.shake{animation:shake .32s}
@keyframes shake{20%{transform:translateX(-8px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}

/* Float text */
#fx{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.float{position:absolute;left:50%;top:46%;transform:translate(-50%,0);font-family:var(--f-display);font-weight:900;font-size:28px;color:var(--amber);text-shadow:0 4px 18px rgba(0,0,0,.5);animation:floatUp .9s var(--ease) forwards;white-space:nowrap}
.float.green{color:var(--line-hi)}
@keyframes floatUp{0%{transform:translate(-50%,10px) scale(.8);opacity:0}20%{opacity:1;transform:translate(-50%,0) scale(1.05)}100%{transform:translate(-50%,-70px) scale(1);opacity:0}}
#flash{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 60%,color-mix(in srgb,var(--line-hi) 22%,transparent),transparent 60%);opacity:0;transition:opacity .5s}
#flash.on{opacity:1;transition:opacity .06s}

/* Sheets */
#scrim{position:fixed;inset:0;background:rgba(4,7,10,.5);backdrop-filter:blur(8px);display:flex;align-items:flex-start;justify-content:center;overflow:auto;animation:fadeIn .3s var(--ease);
  padding-top:max(20px,env(safe-area-inset-top,0px));padding-bottom:max(20px,env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
@keyframes fadeIn{from{opacity:0}}
.panel{width:min(480px,100%);margin:auto;background:var(--sign);color:var(--ink);border-radius:26px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.55);animation:sheetIn .45s var(--ease)}
@keyframes sheetIn{from{transform:translateY(24px) scale(.97);opacity:0}}
.panel-head{background:linear-gradient(135deg,var(--line-hi),var(--line) 55%,var(--line-deep));color:#fff;padding:14px 20px;display:flex;align-items:center;gap:10px}
.panel-head .badge{background:#fff;color:var(--line-deep);box-shadow:none}
.panel-head b{font-family:var(--f-display);font-weight:900;font-size:21px;letter-spacing:-.02em}
.panel-head span{margin-left:auto;font-size:12px;font-weight:700;opacity:.92}
.panel-head.xfer{background:linear-gradient(135deg,#2a333b,var(--ink))}
.panel-head.xfer .badge{background:var(--line);color:#fff}
.panel-body{padding:20px;display:flex;flex-direction:column;gap:14px}
.panel-body h2{font-family:var(--f-display);font-weight:900;font-size:24px;letter-spacing:-.02em;margin:0;line-height:1.25;text-wrap:balance}
.panel-body p{margin:0;line-height:1.65;color:#46525a;font-size:15px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row .btn{flex:1}
.lines{display:flex;flex-direction:column;gap:7px}
.lineopt{display:flex;align-items:center;gap:12px;width:100%;padding:11px 14px 23px;border-radius:var(--r-md);border:1.5px solid #dfe5e2;background:#fff;cursor:pointer;text-align:left;font:inherit;color:var(--ink);transition:border-color .2s,box-shadow .25s,transform .15s var(--ease)}
.lineopt:active{transform:scale(.99)}
.lineopt[aria-pressed="true"]{border-color:var(--c);box-shadow:0 0 0 4px color-mix(in srgb,var(--c) 18%,transparent),0 8px 20px color-mix(in srgb,var(--c) 15%,transparent)}
.ln{flex:none;width:30px;height:30px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;font:900 15px var(--f-body)}
.lmap{position:relative;flex:1;min-width:0;display:flex;justify-content:space-between;align-items:center;height:7px;margin-right:6px}
.lrail{position:absolute;left:0;right:0;top:2px;height:3px;border-radius:99px;background:var(--c)}
.lst{position:relative;width:7px;height:7px}
.lst i{position:absolute;inset:0;border-radius:50%;background:#fff;border:2px solid var(--c);box-sizing:border-box}
.lst.x i{border-color:var(--ink)}
.lst em{display:none;position:absolute;top:12px;font-style:normal;font-size:11px;font-weight:700;white-space:nowrap;color:#56626a}
.lst:first-of-type em{display:block;left:0}
.lst:last-child em{display:block;right:0}
.howto{display:grid;grid-template-columns:auto 1fr;gap:7px 12px;font-size:14px;color:#46525a;margin:0;background:var(--soft);padding:12px 14px;border-radius:var(--r-md)}
.howto dt{font-weight:900;color:var(--line-deep)}
.howto dd{margin:0}
.panel-body .title-big{font-family:var(--f-display);font-weight:900;font-size:clamp(34px,10vw,44px);letter-spacing:-.04em;line-height:1.05;margin:0;color:var(--ink)}
.panel-body .title-big em{font-style:normal;background:linear-gradient(90deg,var(--line-deep),var(--line-hi));-webkit-background-clip:text;background-clip:text;color:transparent}
.best{font-family:var(--f-mono);font-size:13px;color:#5d676e}

.mg-top{display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:14px}
.mg-top .clock{font-family:var(--f-mono);background:var(--ink);color:var(--amber);padding:4px 12px;border-radius:99px;font-variant-numeric:tabular-nums}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;perspective:600px}
.card{aspect-ratio:1;max-width:100%;border-radius:var(--r-md);border:0;background:linear-gradient(145deg,var(--line-hi),var(--line));cursor:pointer;font-size:clamp(26px,8vw,36px);display:grid;place-items:center;transition:transform .35s var(--ease),background .25s;position:relative;box-shadow:0 4px 12px color-mix(in srgb,var(--line) 25%,transparent)}
.card span{opacity:0;transition:opacity .15s}
.card::after{content:"";position:absolute;width:30%;height:30%;border-radius:50%;border:3px solid rgba(255,255,255,.6)}
.card.up,.card.done{background:#fff;box-shadow:inset 0 0 0 1.5px #dbe2df;transform:rotateY(180deg)}
.card.up span,.card.done span{opacity:1;transform:rotateY(180deg)}
.card.up::after,.card.done::after{display:none}
.card.done{opacity:.5}
.holes{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.hole{aspect-ratio:1.15;max-width:100%;border-radius:50% 50% 18px 18px / 30% 30% 18px 18px;border:0;background:radial-gradient(ellipse at 50% 85%,#1d2328 35%,#3d474e 37%,#e1e7e4 72%);cursor:pointer;font-size:clamp(34px,11vw,50px);display:grid;place-items:end center;padding-bottom:8%;overflow:hidden}
.hole span{transform:translateY(110%);transition:transform .16s var(--ease)}
.hole.up span{transform:translateY(0)}
.hole.hit span{transform:translateY(0) scale(.7) rotate(-18deg);filter:grayscale(1)}
.slide{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;background:var(--soft);padding:7px;border-radius:var(--r-md)}
.tile{aspect-ratio:1;max-width:100%;border:0;border-radius:var(--r-sm);font:900 clamp(28px,9vw,40px) var(--f-display);color:#fff;cursor:pointer;display:grid;place-items:center;box-shadow:inset 0 -4px 0 rgba(0,0,0,.15);transition:transform .12s}
.tile:active{transform:scale(.95)}
.tile.empty{background:transparent;cursor:default;box-shadow:none}
.mathq{font-family:var(--f-display);font-weight:900;font-size:46px;text-align:center;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.stroop{font-family:var(--f-display);font-weight:900;font-size:60px;text-align:center;background:#fff;border-radius:var(--r-md);padding:10px;box-shadow:inset 0 0 0 1.5px #dbe2df}
.cbtns{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.cbtn{display:flex;align-items:center;justify-content:center;gap:8px;font:700 17px var(--f-body);padding:12px;border-radius:var(--r-md);border:1.5px solid #dbe2df;background:#fff;color:var(--ink);cursor:pointer;min-height:50px;transition:transform .12s}
.cbtn:active{transform:scale(.97)}
.cbtn i{width:16px;height:16px;border-radius:50%}
.sentence{font-weight:700;font-size:21px;line-height:1.65;background:#fff;border-radius:var(--r-md);padding:14px;box-shadow:inset 0 0 0 1.5px #dbe2df;word-break:keep-all}
.sentence .ok{color:var(--line-deep);background:color-mix(in srgb,var(--line) 14%,#fff);border-radius:4px}
.panel .mg-input{background:#fff;color:var(--ink);border-color:#dbe2df}
.panel .tbar{background:#e2e8e5}
.result-big{font-family:var(--f-display);font-weight:900;font-size:56px;letter-spacing:-.03em;color:var(--line-deep);text-align:center;line-height:1}
.result-msg{text-align:center;font-weight:700}
.stars{font-size:40px;text-align:center;letter-spacing:6px;color:var(--amber);text-shadow:0 4px 14px rgba(255,170,30,.35)}
.stars .off{color:#d6ddda;text-shadow:none}
.sumgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.sumgrid div{background:#fff;border-radius:var(--r-md);padding:11px 13px;box-shadow:inset 0 0 0 1.5px #e0e6e3}
.sumgrid span{display:block;font-size:12px;color:#6a747a}
.sumgrid b{font-family:var(--f-mono);font-size:22px;font-variant-numeric:tabular-nums}

.lb{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;color:#fff;font:900 11px var(--f-body);flex:none}
.q-card{background:#fff;border-radius:var(--r-md);padding:16px;text-align:center;box-shadow:inset 0 0 0 1.5px #dbe2df;display:flex;flex-direction:column;gap:4px;align-items:center}
.q-line{display:flex;gap:6px;align-items:center;font-size:13px;font-weight:700;color:#56626a}
.q-big{font-family:var(--f-display);font-weight:900;font-size:clamp(28px,8vw,38px);letter-spacing:-.03em;word-break:keep-all}
.q-sub{font-size:14px;color:#56626a;font-weight:700}
.q-emoji{font-size:30px}
.q-opts{display:grid;grid-template-columns:1fr;gap:8px}
.cbtn.right{border-color:var(--line);background:color-mix(in srgb,var(--line) 14%,#fff)}
.cbtn.wrong{border-color:var(--red);background:#ffeceb}
.bk-track{position:relative;height:110px;border-radius:var(--r-md);overflow:hidden;background:linear-gradient(180deg,#1b232b,#0d1115)}
.bk-plat{position:absolute;left:0;right:0;bottom:0;height:26px;background:#c9d1d6;box-shadow:inset 0 4px 0 #ffcc00}
.bk-line{position:absolute;left:80%;top:0;bottom:0;width:3px;background:var(--red);box-shadow:0 0 12px var(--red)}
.bk-line span{position:absolute;top:6px;left:6px;font-size:11px;font-weight:900;color:#fff;white-space:nowrap}
.bk-train{position:absolute;bottom:26px;left:-26%;width:26%;height:52px;border-radius:14px 22px 6px 6px;background:linear-gradient(180deg,#e8edf0,#aeb8be);box-shadow:inset 0 -8px 0 var(--line)}
.bk-train i{position:absolute;right:8px;top:9px;width:30%;height:16px;border-radius:4px 10px 4px 4px;background:#2a3640}
.bk-meter{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap;font-size:13px;color:#56626a}
.bk-meter b{font-family:var(--f-mono);font-size:26px;color:var(--ink);font-variant-numeric:tabular-nums}
.bk-hint{flex-basis:100%;font-size:12px}
.bk-btn{width:100%;min-height:56px;font-size:17px;touch-action:none;user-select:none;-webkit-user-select:none}
.bk-btn.on{filter:brightness(.85);transform:scale(.98)}
.gt-wrap{display:flex;flex-direction:column;gap:10px;padding:18px 0 6px}
.gt-bar{position:relative;height:46px;border-radius:99px;background:#dfe5e2;overflow:hidden}
.gt-zone{position:absolute;top:0;bottom:0;background:color-mix(in srgb,var(--line) 70%,#fff);transition:left .25s var(--ease),width .25s var(--ease)}
.gt-zone i{position:absolute;left:33.3%;right:33.3%;top:0;bottom:0;background:var(--line)}
.gt-mk{position:absolute;top:-4px;bottom:-4px;width:5px;margin-left:-2.5px;background:var(--ink);border-radius:3px}
.gt-msg{text-align:center;font-weight:900;font-size:16px;min-height:1.4em}
.mz{display:grid;grid-template-columns:repeat(9,1fr);aspect-ratio:1;max-width:100%;background:#fff;border-radius:var(--r-sm);box-shadow:inset 0 0 0 3px var(--ink);padding:3px;touch-action:none}
.mz div{border:0 solid var(--ink);display:grid;place-items:center;position:relative}
.mz .wt{border-top-width:2px}.mz .wr{border-right-width:2px}.mz .wb{border-bottom-width:2px}.mz .wl{border-left-width:2px}
.mz .tr{background:color-mix(in srgb,var(--line) 12%,#fff)}
.mz .goal{background:color-mix(in srgb,var(--line) 30%,#fff)}
.mz .goal b{font-size:9px;font-weight:900;color:var(--line-deep)}
.mz .me{width:62%;height:62%;border-radius:50%;background:var(--amber);box-shadow:0 0 0 2px #fff,0 2px 6px rgba(0,0,0,.3)}
.pad{display:grid;grid-template-columns:repeat(3,64px);gap:6px;justify-content:center}
.pad .cbtn{min-height:52px;padding:0}
.lf-ask{text-align:center;font-size:15px;font-weight:700;color:#46525a}
.lf-ask b{color:var(--ink);font-size:20px}
.lf{position:relative;aspect-ratio:1;max-width:100%;background:linear-gradient(145deg,#fff,#eef2f0);border-radius:var(--r-md);box-shadow:inset 0 0 0 1.5px #dbe2df;overflow:hidden}
.lf-it{position:absolute;width:12%;aspect-ratio:1;border:0;background:none;font-size:clamp(20px,6.5vw,30px);cursor:pointer;padding:0;line-height:1}
.lf-it.nope{opacity:.2}
.rn{width:100%;height:200px;border-radius:var(--r-md);display:block;touch-action:none}
.fare{display:flex;flex-direction:column;align-items:center;gap:6px;background:#fff;border-radius:var(--r-md);padding:14px;box-shadow:inset 0 0 0 1.5px #dbe2df;font-size:13px;color:#56626a;font-weight:700}
.fare b{font-family:var(--f-mono);font-size:34px;color:var(--ink)}
.fare-bar{width:100%;height:8px;border-radius:99px;background:#e2e8e5;overflow:hidden}
.fare-bar i{display:block;height:100%;width:0;background:var(--line);transition:width .2s var(--ease)}
.coins{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.coin{aspect-ratio:1;max-width:100%;border-radius:50%;border:0;background:radial-gradient(circle at 35% 30%,#fff3cf,#d9a441 70%,#b07d24);font:900 13px var(--f-body);color:#4a3410;cursor:pointer;box-shadow:0 3px 0 #8e6418;transition:transform .1s}
.coin:active{transform:translateY(2px);box-shadow:0 1px 0 #8e6418}
.coin.bill{border-radius:8px;aspect-ratio:1.6/1;align-self:center;background:linear-gradient(135deg,#d7ecd9,#9ccaa3);color:#24452a;box-shadow:0 3px 0 #6f9b76}

/* ---- v3: 칩 · 배너 · 이벤트 효과 ---- */
.chips{display:flex;flex-wrap:wrap;gap:5px;justify-content:center}
.chip{font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:99px;background:rgba(255,255,255,.08);color:#dbe4e8;white-space:nowrap}
.chip.mode{background:color-mix(in srgb,var(--line) 32%,transparent);color:#fff}
.chip.life{color:#ff8f87;letter-spacing:1px}
.chip.item{background:rgba(255,191,60,.14);color:var(--amber)}
.chip.fx{background:rgba(255,97,89,.16);color:#ffb0aa}
.chip.fever{background:linear-gradient(90deg,#ff7a2f,#ffbf3c);color:#2a1503}
.stat.tpm b{color:#fff}
.banner{position:absolute;left:50%;bottom:max(14%,calc(env(safe-area-inset-bottom,0px) + 40px));transform:translate(-50%,24px) scale(.96);opacity:0;pointer-events:none;display:flex;align-items:center;gap:12px;width:max-content;max-width:min(92vw,520px);
  padding:12px 18px;border-radius:20px;background:rgba(12,17,22,.82);border:1px solid rgba(255,255,255,.12);backdrop-filter:blur(14px);box-shadow:0 18px 50px rgba(0,0,0,.45);transition:opacity .35s var(--ease),transform .45s var(--ease);z-index:5}
.banner.show{opacity:1;transform:translate(-50%,0) scale(1)}
.banner .bi{font-size:34px;line-height:1}
.banner .bt{display:flex;flex-direction:column;min-width:0}
.banner b{font-size:18px;font-weight:900;letter-spacing:-.02em;color:#fff}
.banner small{font-size:12.5px;color:#b9c4ca}
.banner.mode{border-color:color-mix(in srgb,var(--line-hi) 50%,transparent)}
.banner.emg{border-color:rgba(255,97,89,.6);background:rgba(50,10,10,.85)}
.banner.troll{border-color:rgba(190,120,255,.55);background:rgba(30,14,46,.86)}
.banner.pop{border-color:rgba(255,191,60,.55)}
.banner.fever{border-color:#ffbf3c;background:rgba(60,28,4,.88)}
.banner.good,.banner.pass{border-color:rgba(95,220,152,.55)}
#flash2{position:absolute;inset:0;pointer-events:none;background:#fff;opacity:0;transition:opacity .6s}
#flash2.on{opacity:.75;transition:opacity .05s}
#alarmFx{position:absolute;inset:0;pointer-events:none;opacity:0;background:radial-gradient(ellipse at 50% 50%,transparent 35%,rgba(255,30,30,.55) 100%)}
#stage.alarm #alarmFx{animation:alarm .8s ease-in-out infinite}
@keyframes alarm{50%{opacity:1}}
#darkFx{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 55%,rgba(2,3,5,.78),rgba(2,3,5,.96));opacity:0;transition:opacity .4s}
#stage.dark #darkFx{opacity:1;animation:flicker 3s steps(1) infinite}
#stage.dark #word{color:#4a535a;animation:flicker 2.4s steps(1) infinite}
#stage.dark #word .ok{color:#3f7a5a;text-shadow:none}
@keyframes flicker{0%,100%{opacity:1}42%{opacity:.25}44%{opacity:1}71%{opacity:.4}72%{opacity:1}}
#stage.hurt #ui{animation:hurt .4s}
@keyframes hurt{20%{transform:translateX(-10px);filter:drop-shadow(0 0 0 red)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}}
body.fever #typebox{box-shadow:0 0 0 2px var(--amber),0 0 48px rgba(255,150,30,.35),0 20px 50px rgba(0,0,0,.4)}
#word.mirror{transform:scaleX(-1)}
#word.tiny{font-size:13px!important;letter-spacing:0}
#word.quake{animation:quake .22s linear infinite}
@keyframes quake{25%{transform:translate(-3px,2px) rotate(-3deg)}50%{transform:translate(3px,-2px) rotate(2deg)}75%{transform:translate(-2px,-1px) rotate(-1deg)}}
#word.smoke{filter:blur(3.2px);animation:smoke 1.8s ease-in-out infinite}
@keyframes smoke{50%{filter:blur(1.2px)}}
#word.trap{color:var(--red);text-decoration:line-through;text-decoration-thickness:4px}
#word.emg{color:#ff9a92;font-size:clamp(26px,7vw,40px)}
#word.cat{color:#ffd36b}
#word.long{font-size:clamp(20px,5.2vw,30px);line-height:1.4}
#word.swapped{animation:swapped .45s}
@keyframes swapped{0%{transform:scale(1.25);color:#c79bff}100%{transform:none}}
.pigeon{position:absolute;left:-15%;font-size:92px;animation:fly 1.6s linear forwards;z-index:4;pointer-events:none}
.pigeon span{display:inline-block;animation:bob .25s ease-in-out infinite alternate}
.pigeon.rev{animation-name:flyR}
.pigeon.rev span{transform:scaleX(-1)}
@keyframes fly{to{left:110%}}
@keyframes flyR{from{left:110%}to{left:-20%}}
@keyframes bob{to{translate:0 -14px}}
.pax{position:absolute;top:30%;right:-30%;font-size:min(240px,52vw);line-height:1;z-index:4;pointer-events:none;animation:pax 3.3s var(--ease) forwards}
.pax i{position:absolute;top:8%;right:70%;font:700 15px var(--f-body);font-style:normal;white-space:nowrap;background:#fff;color:var(--ink);padding:8px 12px;border-radius:14px 14px 2px 14px}
.pax.animal{font-size:min(160px,40vw);top:40%;animation:pax 4.2s var(--ease) forwards}
@keyframes pax{0%{right:-40%}18%,78%{right:28%}100%{right:120%}}
.balloon{position:absolute;bottom:-90px;font-size:56px;background:none;border:0;cursor:pointer;pointer-events:auto;animation:rise 6s linear forwards;z-index:6;padding:0}
.balloon.popd{animation:none}
@keyframes rise{to{transform:translateY(calc(-100vh - 120px)) rotate(8deg)}}
/* 경로 점 종류 */
.route .dot.t-boss{border-color:var(--ink);background:#fff;box-shadow:0 0 0 2px var(--amber)}
.route .dot.t-shop{border-color:var(--amber)}
.route .dot.t-roulette{border-color:#b77dff}
.route .dot.t-pass{border-style:dashed;opacity:.7}
.route .dot.passed{background:var(--line)}
/* 시작 화면 */
.sec{display:flex;flex-direction:column;gap:8px}
.sec-t{font-weight:900!important;color:var(--ink)!important;font-size:14px!important}
.diffs{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}
.diffopt,.courseopt{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;padding:10px 12px;border-radius:var(--r-md);border:1.5px solid #dfe5e2;background:#fff;color:var(--ink);font:inherit;cursor:pointer;min-width:0;transition:border-color .2s,box-shadow .25s}
.diffopt .dname,.courseopt b{font-weight:900;font-size:15px}
.diffopt small,.courseopt small{font-size:11.5px;color:#66727a;line-height:1.4}
.diffopt[aria-pressed="true"],.courseopt[aria-pressed="true"]{border-color:var(--line);box-shadow:0 0 0 4px color-mix(in srgb,var(--line) 18%,transparent)}
.diffopt[data-k="hell"][aria-pressed="true"]{border-color:#c0392b;box-shadow:0 0 0 4px rgba(192,57,43,.18)}
.seg2{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.diffopt:focus-visible,.courseopt:focus-visible,.shop-it:focus-visible,.sim:focus-visible,.signal:focus-visible,.d-it:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.panel .sub{text-align:center;margin-top:-6px!important;font-size:13.5px!important}
.mg-intro{display:flex;align-items:center;gap:12px}
.mg-intro .mg-ico{font-size:40px;line-height:1;width:58px;height:58px;display:grid;place-items:center;border-radius:16px;background:color-mix(in srgb,var(--line) 14%,#fff);flex:none}
.mg-intro.sm .mg-ico{font-size:24px;width:38px;height:38px;border-radius:11px}
.mg-intro.sm h2{font-size:19px}
.mg-area{display:flex;flex-direction:column;gap:12px}
.mg-hint{font-size:13px!important;color:#56626a!important;text-align:center}
/* 결과 */
.rank{display:flex;align-items:center;justify-content:center;gap:10px;background:var(--soft);border-radius:var(--r-md);padding:10px 14px;flex-wrap:wrap}
.rank span{font-size:30px}.rank b{font-size:19px;font-weight:900}.rank em{font-style:normal;font-family:var(--f-mono);color:#56626a}
.result-big small{font-size:18px;color:#56626a;letter-spacing:0}
.ladder{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.ladder span{display:flex;flex-direction:column;align-items:center;font-size:20px;padding:6px 0;border-radius:10px;background:#fff;box-shadow:inset 0 0 0 1px #e0e6e3;opacity:.55}
.ladder span small{font-size:10px;font-family:var(--f-mono);color:#56626a}
.ladder span.on{opacity:1;box-shadow:inset 0 0 0 2px var(--line);background:color-mix(in srgb,var(--line) 10%,#fff)}
.sumgrid{grid-template-columns:repeat(2,1fr)}
.tchart-wrap{background:#fff;border-radius:var(--r-md);padding:12px;box-shadow:inset 0 0 0 1.5px #e0e6e3;display:flex;flex-direction:column;gap:6px}
.tchart-h{display:flex;justify-content:space-between;font-size:11.5px;font-weight:700;color:#56626a}
.tchart{height:90px;display:flex;align-items:flex-end;gap:3px;border-bottom:1px solid #dfe5e2}
.tchart i{flex:1;min-width:2px;background:linear-gradient(180deg,var(--line-hi),var(--line));border-radius:3px 3px 0 0}
/* 매점·룰렛 */
.wallet{display:flex;justify-content:space-between;align-items:center;background:var(--soft);border-radius:var(--r-md);padding:10px 14px;font-weight:700;color:#46525a}
.wallet b{font-family:var(--f-mono);font-size:22px;color:var(--ink)}
.shop{display:flex;flex-direction:column;gap:7px}
.shop-it{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:10px 12px;border-radius:var(--r-md);border:1.5px solid #dfe5e2;background:#fff;color:var(--ink);font:inherit;cursor:pointer;transition:transform .12s}
.shop-it:active{transform:scale(.99)}
.shop-it:disabled{opacity:.45;cursor:not-allowed}
.shop-it .si{font-size:28px;flex:none}
.shop-it .sn{flex:1;min-width:0;display:flex;flex-direction:column}
.shop-it .sn small{font-size:12px;color:#66727a}
.shop-it .sp{font-family:var(--f-mono);font-weight:700;font-size:13px;display:flex;flex-direction:column;align-items:flex-end;white-space:nowrap}
.shop-it .sp em{font-style:normal;font-size:11px;color:var(--line-deep)}
.wheel-wrap{position:relative;width:240px;height:240px;max-width:100%;margin:4px auto}
.wheel{width:100%;height:100%;border-radius:50%;position:relative;box-shadow:0 0 0 6px #fff,0 0 0 8px #dfe5e2,0 14px 30px rgba(0,0,0,.18);transition:transform 4.1s cubic-bezier(.15,.75,.1,1)}
.wheel span{position:absolute;left:50%;top:50%;width:40px;height:40px;margin:-20px 0 0 -20px;display:grid;place-items:center;font-size:24px}
.wheel-pin{position:absolute;left:50%;top:-12px;width:0;height:0;margin-left:-12px;border:12px solid transparent;border-top:22px solid var(--red);filter:drop-shadow(0 2px 2px rgba(0,0,0,.3))}
/* 신규 미니게임 */
.mg-inwrap{display:flex}
.mg-inwrap .mg-input{color:transparent;caret-color:transparent;width:100%}
.panel .inview{color:var(--ink)}
.panel .inview .ph{color:#9aa5ab}
.rain{position:relative;height:300px;border-radius:var(--r-md);overflow:hidden;background:linear-gradient(180deg,#1d2731,#0f1418)}
.rain-ground{position:absolute;left:0;right:0;bottom:0;height:40px;background:linear-gradient(180deg,var(--line),var(--line-deep))}
.drop{position:absolute;top:0;padding:4px 10px;border-radius:99px;background:#fff;color:var(--ink);font-weight:900;font-size:15px;white-space:nowrap;box-shadow:0 4px 12px rgba(0,0,0,.35)}
.drop.popd{background:var(--line-hi);transition:opacity .25s,scale .25s;opacity:0;scale:1.4}
.drop.splash{background:var(--red);color:#fff}
.q-big.cho{letter-spacing:.12em;color:var(--line-deep)}
.q-big.digits{font-family:var(--f-mono);letter-spacing:.12em}
.q-big.sm{font-size:clamp(20px,6vw,28px)}
.q-opts.four{grid-template-columns:repeat(2,1fr)}
.simon{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.sim{aspect-ratio:1.5;max-width:100%;border:0;border-radius:var(--r-md);background:var(--c);color:#fff;font:900 34px var(--f-body);cursor:pointer;opacity:.55;transition:opacity .12s,transform .12s;display:flex;align-items:center;justify-content:center;gap:2px}
.sim small{font-size:13px;font-weight:700}
.sim.lit{opacity:1;transform:scale(1.04);box-shadow:0 0 30px var(--c)}
.signal{display:flex;flex-direction:column;align-items:center;gap:12px;width:100%;padding:18px;border:0;border-radius:var(--r-md);background:#1a2128;color:#fff;cursor:pointer;font:inherit;touch-action:manipulation}
.signal .lamps{display:flex;gap:14px;padding:12px 18px;background:#0c1014;border-radius:99px}
.signal .lamps i{width:46px;height:46px;border-radius:50%;background:#2a2f33}
.signal .lamps .r{background:#ff3b30;box-shadow:0 0 22px #ff3b30}
.signal.go .lamps .r{background:#3a2020;box-shadow:none}
.signal.go .lamps .g{background:#2bd27a;box-shadow:0 0 30px #2bd27a}
.signal.early{background:#4a1714}
.signal b{font-size:20px;font-weight:900}
.watch{font-family:var(--f-mono);font-weight:700;font-size:64px;text-align:center;background:#fff;border-radius:var(--r-md);padding:8px;box-shadow:inset 0 0 0 1.5px #dbe2df;font-variant-numeric:tabular-nums}
.watch.good{color:var(--line-deep)}
.asm-slot{display:flex;justify-content:center;gap:6px;flex-wrap:wrap}
.asm-slot i{width:44px;height:50px;border-radius:10px;background:#fff;box-shadow:inset 0 -3px 0 var(--line);display:grid;place-items:center;font:900 22px var(--f-body);font-style:normal;color:var(--ink)}
.asm-slot.done i{background:color-mix(in srgb,var(--line) 18%,#fff)}
.asm{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}
.asm-b{min-width:54px;font-size:22px!important}
.asm-b:disabled{opacity:.25}
.shade{display:grid;gap:5px;aspect-ratio:1;max-width:100%}
.shade button{border:0;border-radius:8px;cursor:pointer;min-width:0;min-height:0}
.push{position:relative;height:150px;border-radius:var(--r-md);overflow:hidden;background:linear-gradient(180deg,#e9eef0,#cfd7da)}
.push-car{position:absolute;left:0;top:0;bottom:0;width:45%;background:linear-gradient(90deg,#b8c2c8,#dfe5e8);font-size:26px;display:flex;flex-wrap:wrap;align-content:center;padding:8px;line-height:1.1;overflow:hidden}
.push-door{position:absolute;left:45%;top:0;bottom:0;width:6px;background:var(--line)}
.push-man{position:absolute;bottom:14px;right:8%;font-size:64px;transition:right .05s}
.bal{position:relative;height:150px;border-radius:var(--r-md);background:linear-gradient(180deg,#eef2f0,#dfe6e3);overflow:hidden}
.bal-zone{position:absolute;left:39.6%;width:20.8%;top:0;bottom:0;background:rgba(255,97,89,.12);transition:background .2s}
.bal.ok .bal-zone{background:color-mix(in srgb,var(--line) 25%,transparent)}
.bal-man{position:absolute;bottom:26px;left:50%;font-size:70px;transform-origin:50% 100%}
.bal-bar{position:absolute;left:3%;right:3%;bottom:10px;height:8px;border-radius:99px;background:#cfd7d3}
.bal-bar i{position:absolute;top:-4px;width:16px;height:16px;margin-left:-8px;border-radius:50%;background:var(--ink)}
.rn.tall{height:auto}
#cc{height:260px}#rc{height:280px}
.lanes{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.lane{font-family:var(--f-mono)!important;touch-action:manipulation}
.darkroom{position:relative;height:300px;border-radius:var(--r-md);overflow:hidden;background:#20262b;touch-action:none;--x:50%;--y:50%}
.dark-mask{position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle 78px at var(--x) var(--y),rgba(0,0,0,0) 0,rgba(0,0,0,0) 50%,rgba(3,5,7,.97) 100%)}
.d-it{position:absolute;width:13%;aspect-ratio:1;border:0;background:none;font-size:clamp(22px,7vw,32px);cursor:pointer;padding:0;line-height:1;display:flex;flex-direction:column;align-items:center}
.d-it.exit small{font:900 9px var(--f-body);color:#fff;background:#18a957;padding:1px 4px;border-radius:3px}
.stairs{position:relative;height:200px;border-radius:var(--r-md);overflow:hidden;background-color:#e6ebe9;background-image:linear-gradient(135deg,transparent 0 50%,#c9d2ce 50% 100%);background-size:56px 56px}
.climber{position:absolute;left:44%;top:38%;font-size:64px;transform:scaleX(-1)}

  if(st.type==='nostop'){G.si++;hud();showStopPass(G.si);led('🚏 '+st.name+(st.virtual?' (가상 정류장)':'')+' · 미정차 통과');floatText((st.virtual?'가상 정류장':'미정차')+' 통과','green');G.phase='arrive';later(beginSegment,250);return}
  if(st.type==='onboard'){G.si++;hud();showStopPass(G.si);led('🚌 '+st.name+' 통과 중 · 차내 미니게임!');G.phase='station';setIdle('차내 미니게임 준비…','🎮 차내 이벤트');later(runStationGame,800);return}
  const must=st.terminal||['boss','shop','game','roulette'].includes(st.type);
  let bell=false,wait=0;
  if(!must){bell=Math.random()<.42;wait=Math.random()<.5?1+rnd(4):0}
  if(!must&&!bell&&!wait){busSkip(st);return}
  G.busWait=wait||(must?1+rnd(3):0);
  const why=st.terminal?'종점':st.rest?'휴게소 정차':bell&&wait?'🔔 하차벨 · 🧍 '+wait+'명 대기':bell?'🔔 하차벨이 울렸어':wait?'🧍 '+wait+'명이 기다려':'주요 정류장';
  banner('🚏',st.name,why+' · 정차해서 문을 열어','mode');
  setIdle(st.name+' 정류장에 들어가는 중…','곧 정차');
  const nx=STATIONS[G.si+2];led('이번 정류장은 '+st.name+'입니다.'+(st.terminal?' 이 버스의 종점입니다.':nx?' 다음 정류장은 '+nx.name+'입니다.':''));
  sfx.chime();
  const go=()=>{G.si++;hud();doorPrompt()};
  if(glOK){setPlatformSigns(G.si+1);setStopKind(st);plat.visible=true;plat.position.z=-130;W.mode='approach';W.onStop=go}else later(go,2000);
}
function busSkip(st){
  banner('🚏','미정차 판정!','내릴 사람도 탈 사람도 없어. 치지 말고 지나가!','troll');
  showStopPass(G.si+1);G.phase='ride';
  const done=()=>{G.si++;hud();G.phase='arrive';later(beginSegment,350)};
  setTarget(st.typeName,{limit:2.4,cls:'trap',prompt:'🚏 '+st.name+' · 아무도 없어! 치면 괜히 서는 거야',
    onOK:()=>{sfx.bad();loseCombo();G.score=Math.max(0,G.score-100);floatText('괜히 정차! -100','');fb('승객도 없는데 섰어… -100','bad');done()},
    onTimeout:()=>{G.score+=80;G.coins+=2;sfx.ok();floatText('미정차 통과 +80','green');fb('정확한 미정차!','good');done()}});
}
function passStation(){
  const st=STATIONS[G.si+1];

function doorPrompt(){

function doorOK(){

  const st=STATIONS[G.si];G.phase='station';hud();

    const n=G.bus?G.busWait||0:2+rnd(6);G.coins+=n;
    setIdle(G.bus?(n?'🪪 교통카드 찍는 중… 삑! 삑!':'🔔 손님이 내리는 중…'):'승객이 타고 내리는 중…',G.bus?(n?n+'명 탑승':'하차 완료'):'잠깐 정차');

    later(afterStation,G.bus?700+n*170:900);return}
  led(st.name+(G.bus?' · ':'역 · ')+({boss:'보스전이 기다리고 있어요',shop:st.rest?'휴게소에서 쉬어 가세요':'매점이 열려 있어요',roulette:'행운 룰렛 이벤트 중!',game:G.bus?'정류장 미션이 기다리고 있어요':'승강장에서 미션이 기다리고 있어요'}[st.type]||''));
  setIdle('잠시 후 시작…',V().door+'이 열립니다');

function runStation(){const st=STATIONS[G.si];if(st.type==='shop')openShop();else if(st.type==='roulette')openRoulette();else if(st.type==='quick'||st.type==='stop')afterStation();else runStationGame()}

function fireEvent(k){
  const e=EVENTS[k],fx=G.fx;
  if((e.cat==='troll'||e.cat==='emg')&&G.items.guard>0){G.items.guard--;banner('🍀','억까 방지권 발동',e.name+' 이벤트를 막았어','good');hud();return false}
  G.events++;
  banner(e.icon,e.name,e.desc,e.cat);sfx[e.cat==='pop'?'pop':e.cat==='emg'?'alarm':'troll']();
  led(e.icon+' '+e.name+' · '+e.desc);
  switch(k){
    case'pigeon':spawnPigeons();break;
    case'passenger':spawnPassenger();break;
    case'balloon':spawnBalloons();break;
    case'goldtrain':fx.golden=4;break;
    case'blackout':fx.blackout=5;$('#stage').classList.add('dark');break;
    case'smoke':fx.smoke=5;break;
    case'crowd':fx.crowd=6;break;
    case'mirror':fx.mirror=4;break;
    case'tiny':fx.tiny=4;break;
    case'shuffle':fx.shuffle=4;break;
    case'thief':fx.thief=3;break;
    case'vanish':fx.vanish=4;break;
    case'quake':fx.quake=5;break;
    case'swap':fx.swap=2;break;
    case'trap':trapSeq();return true;
    case'redlight':redlightSeq();return true;
    case'cutin':phraseSeq('빵빵','🚗 끼어들기! "빵빵"을 빨리 쳐서 경적!',3.2,'cat',{ok:150,slow:true,fail:'끼어든 차 때문에 느려졌어'});return true;
    case'suddenbrake':phraseSeq('손잡이를 꼭 잡아 주세요','⚠️ 급정거! 안내방송을 쳐서 승객을 지켜',0,'emg',{ok:200,dmg:true,fail:'승객이 넘어졌어…'});return true;
    case'complaint':phraseSeq('불편을 드려 죄송합니다','📢 승객 민원! 사과 방송을 쳐',0,'emg',{ok:150,fail:'민원이 접수됐어… -100',pen:100});return true;
    case'buslane':fx.lane=5;break;
    case'jam':G.segNeed+=3;break;
    case'animal':animalSeq();return true;
    case'estop':estopSeq();return true;
  }
  return false;
}
function phraseSeq(text,prompt,limit,cls,o){
  const d=D();const lim=limit||((d.base+d.per*text.replace(/\s/g,'').length)*1.4+1.5)*C().tm;if(o.slow)W.boost=-25;
  setTarget(text,{limit:lim,cls,prompt,
    onOK:()=>{const b=Math.round(o.ok*D().mult);G.score+=b;sfx.ok();floatText('+'+b,'green');hud();contFlow()},
    onTimeout:()=>{if(o.dmg)damage();if(o.slow)W.boost=-20;if(o.pen)G.score=Math.max(0,G.score-o.pen);fb(o.fail||'놓쳤어','bad');sfx.bad();hud();later(contFlow,400)}});
}

function countdown(sec,el,onEnd){let left=sec;el.textContent=left;const id=setInterval(()=>{left--;el.textContent=Math.max(0,left);if(left<=5&&left>0)sfx.tick();if(left<=0){clearInterval(id);onEnd()}},1000);return()=>clearInterval(id)}
/* 미니게임용 한글 입력칸: 메인 입력칸과 같은 방식으로 조합 중인 글자가 다음 단어에 붙지 않게 처리 */
function imeBox(ph){
  if(G.bus)ph=busify(ph);
  const w=document.createElement('div');w.className='inwrap mg-inwrap';
  w.innerHTML='<input class="mg-input ime" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="send" aria-label="'+ph+'"><div class="inview" aria-hidden="true"></div>';
  const i=w.querySelector('input'),v=w.querySelector('.inview');let base=0,comp=false,cb=null,prev='';
  const typedB=()=>i.value.slice(base).replace(/^\s+/,'');
  const later2=()=>{paint();setTimeout(()=>{if(!comp&&i.value.slice(base).trim()===''){i.value='';base=0;paint()}},40)};
  const paint=()=>{const t=typedB();v.innerHTML=(t?'<span class="tx">'+esc(t)+'</span>':'<span class="ph">'+ph+'</span>')+'<i class="caret"></i>'};
  i.addEventListener('compositionstart',()=>comp=true);
  i.addEventListener('compositionend',()=>{comp=false;paint();cb&&cb(typedB(),false,false)});
  i.addEventListener('input',e=>{if(i.value.length<base){const ins=e.inputType&&e.inputType.indexOf('insert')===0;base=ins?Math.max(0,i.value.length-(e.data||'').length):i.value.length}paint();sfx.key();cb&&cb(typedB(),comp,false)});
  i.addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','Home','End'].includes(e.key)&&!e.isComposing)e.preventDefault()});
  i.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.isComposing){e.preventDefault();cb&&cb(typedB(),comp,true)}});
  paint();
  const eq=t=>{const r=typedB(),nt=norm(t);if(!nt)return false;if(norm(r)===nt)return true;return ghostCands(r,prev).some(c=>norm(c)===nt)};
  return{w,i,typed:typedB,eq,on(f){cb=f},focus(){try{i.focus({preventScroll:true})}catch(e){i.focus()}},
    consume(){prev=typedB();base=i.value.length;if(comp&&finePointer){try{i.blur();i.focus({preventScroll:true})}catch(e){}}base=i.value.length;later2()},clear(){base=i.value.length;later2()}};
}

function mgCards(root,done){
  const sy=['🚇','🎫','🚉','🧳','☕','🗺️'];const deck=shuffle([...sy,...sy]);
  let open=[],matched=0,moves=0,lock=false;const t0=performance.now();
  root.innerHTML=`<div class="mg-top"><span id="mgInfo">뒤집은 횟수 0</span><span class="clock" id="mgClock">60</span></div><div class="cards">${deck.map((s,i)=>`<button class="card" data-i="${i}" aria-label="카드 ${i+1}"><span>${s}</span></button>`).join('')}</div>`;
  mgStop=countdown(60,$('#mgClock'),()=>done(matched*60,'시간 종료! 짝 '+matched+'개를 찾았어'));
  root.querySelectorAll('.card').forEach(b=>b.onclick=()=>{
    if(lock||b.classList.contains('up')||b.classList.contains('done'))return;
    b.classList.add('up');open.push(b);sfx.tick();
    if(open.length===2){moves++;$('#mgInfo').textContent='뒤집은 횟수 '+moves;const[a,c]=open;
      if(deck[a.dataset.i]===deck[c.dataset.i]){a.classList.add('done');c.classList.add('done');open=[];matched++;sfx.ok();
        if(matched===6){const sec=(performance.now()-t0)/1000;done(Math.max(150,700-moves*18-sec*4),moves+'번 만에 모든 짝 완성!')}}
      else{lock=true;setTimeout(()=>{a.classList.remove('up');c.classList.remove('up');open=[];lock=false},650)}}
  });
}

function mgMole(root,done){

function mgBrake(root,done){
  root.innerHTML=`<div class="mg-top"><span id="mgInfo">1 / 3번째 정차</span><span class="clock" id="mgRes">오차 —</span></div>
  <div class="bk-track"><div class="bk-plat"></div><div class="bk-line"><span>정차 위치</span></div><div class="bk-train" id="bkT"><i></i></div></div>
  <div class="bk-meter"><span>속도</span><b id="bkV">0</b><span>km/h</span><span class="bk-hint" id="bkH">버튼(또는 스페이스바)을 누르고 있으면 감속해</span></div>
  <button class="btn go bk-btn" id="bkB" type="button">브레이크 꾹 누르기</button>`;
  const LINE=80,T=$('#bkT'),btn=$('#bkB');let round=0,total=0,x=0,v=0,braking=false,run=false,raf=0,lt=0,alive=true;
  const start=()=>{x=0;v=40+Math.random()*14;run=true;lt=performance.now();$('#mgInfo').textContent=(round+1)+' / 3번째 정차';$('#mgRes').textContent='오차 —';raf=requestAnimationFrame(step)};
  const step=t=>{if(!alive)return;const dt=Math.min(.05,(t-lt)/1000);lt=t;
    if(run){v-=(braking?26:2.2)*dt;if(v<0)v=0;x+=v*dt;
      if(x>=100){x=100;v=0;finish(true)}else if(v===0)finish(false)}
    T.style.left='calc('+x+'% - 26%)';$('#bkV').textContent=Math.round(v*1.8);btn.classList.toggle('on',braking);
    raf=requestAnimationFrame(step)};
  const finish=over=>{run=false;const err=Math.abs(x-LINE);const pts=over?0:Math.max(0,Math.round(170-err*16));total+=pts;
    $('#mgRes').textContent=over?'정차 실패!':'오차 '+err.toFixed(1)+'m';
    if(over||err>4)sfx.bad();else{sfx.ok();if(err<.6)floatText('완벽 정차!','green')}
    round++;setTimeout(()=>{if(!alive)return;if(round<3)start();else done(total,'3번 정차 결과 · 평균 '+Math.round(total/3)+'점')},1300)};

/* 환승 미로: 출구(환승 통로)까지 길 찾기 */
function mgMaze(root,done){
  const n=9,cells=[...Array(n*n)].map(()=>[1,1,1,1]),seen=new Set([0]),stack=[0];
  while(stack.length){const c=stack[stack.length-1],x=c%n,y=(c/n)|0;
    const nb=[[0,-1,0,2],[1,0,1,3],[0,1,2,0],[-1,0,3,1]].map(([dx,dy,w,o])=>[x+dx,y+dy,w,o]).filter(([a,b])=>a>=0&&b>=0&&a<n&&b<n&&!seen.has(b*n+a));
    if(!nb.length){stack.pop();continue}const[a,b,w,o]=nb[rnd(nb.length)],k=b*n+a;cells[c][w]=0;cells[k][o]=0;seen.add(k);stack.push(k)}
  let me=0,moves=0,alive=true;const goal=n*n-1,trail=new Set([0]);
  root.innerHTML=`<div class="mg-top"><span id="mgInfo">${lineBadge(G.line)} 환승 통로 찾기</span><span class="clock" id="mgClock">45</span></div>
  <div class="mz" id="mz"></div><div class="pad"><span></span><button class="cbtn" data-d="0" aria-label="위">▲</button><span></span><button class="cbtn" data-d="3" aria-label="왼쪽">◀</button><button class="cbtn" data-d="2" aria-label="아래">▼</button><button class="cbtn" data-d="1" aria-label="오른쪽">▶</button></div>`;
  const draw=()=>{$('#mz').innerHTML=cells.map((w,i)=>`<div class="${w[0]?'wt ':''}${w[1]?'wr ':''}${w[2]?'wb ':''}${w[3]?'wl ':''}${trail.has(i)?'tr ':''}${i===goal?'goal':''}">${i===me?'<i class="me"></i>':i===goal?'<b>환승</b>':''}</div>`).join('')};
  const move=d=>{if(!alive||cells[me][d])return;const dx=[0,1,0,-1][d],dy=[-1,0,1,0][d];me+=dy*n+dx;moves++;trail.add(me);sfx.key();draw();
    if(me===goal){const left=+$('#mgClock').textContent;stopAll();done(260+left*8,'환승 성공! '+(45-left)+'초 만에 탈출')}};
  root.querySelectorAll('.pad button').forEach(b=>b.onclick=()=>move(+b.dataset.d));
  const rm=onKeys(e=>{const m={ArrowUp:0,KeyW:0,ArrowRight:1,KeyD:1,ArrowDown:2,KeyS:2,ArrowLeft:3,KeyA:3}[e.code];if(m!==undefined){move(m);return true}});
  let sx=0,sy=0;const mz=$('#mz');mz.addEventListener('pointerdown',e=>{sx=e.clientX;sy=e.clientY});
  mz.addEventListener('pointerup',e=>{const dx=e.clientX-sx,dy=e.clientY-sy;if(Math.max(Math.abs(dx),Math.abs(dy))<20)return;move(Math.abs(dx)>Math.abs(dy)?(dx>0?1:3):(dy>0?2:0))});
  draw();const stopT=countdown(45,$('#mgClock'),()=>{stopAll();done(Math.round(trail.size*2),'시간 초과… 다음엔 꼭 탈출하자')});
  const stopAll=()=>{alive=false;rm();stopT()};mgStop=stopAll;
}

/* 막차 달리기: 점프로 장애물 넘기 (캔버스) */
function mgRunner(root,done){
  root.innerHTML=`<div class="mg-top"><span id="mgInfo">♥♥♥ · 코인 0</span><span class="clock" id="mgClock">25</span></div><canvas class="rn" id="rn"></canvas><button class="btn go bk-btn" id="rJ" type="button">점프! (스페이스바 / 화면 터치)</button>`;
  const cv=$('#rn'),ctx=cv.getContext('2d'),dpr=Math.min(2,devicePixelRatio||1);let W=0,H=200;
  const size=()=>{W=cv.clientWidth;cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)};size();
  const col=LINES[G.line].color,gy=H-34;let py=gy,vy=0,jumps=0,obs=[],coins=[],spawn=.8,cs=1.4,t=0,lives=3,inv=0,got=0,alive=true,raf=0,lt=performance.now(),off=0;
  const jump=()=>{if(!alive)return;if(py>=gy-1){vy=-600;jumps=1;tone(520,.1,'triangle',.18)}else if(jumps===1){vy=-520;jumps=2;tone(700,.1,'triangle',.18)}};
  const info=()=>$('#mgInfo').textContent='♥'.repeat(lives)+'♡'.repeat(3-lives)+' · 코인 '+got;
  const step=now=>{if(!alive)return;const dt=Math.min(.04,(now-lt)/1000);lt=now;t+=dt;const sp=260+t*9;
    vy+=1700*dt;py=Math.min(gy,py+vy*dt);if(py>=gy){vy=0;jumps=0}inv=Math.max(0,inv-dt);off=(off+sp*dt)%40;
    spawn-=dt;if(spawn<=0){spawn=.75+Math.random()*.8;const tall=Math.random()<.35;obs.push({x:W+20,w:tall?22:30,h:tall?52:28})}
    cs-=dt;if(cs<=0){cs=.9+Math.random();coins.push({x:W+20,y:gy-60-rnd(60)})}
    obs.forEach(o=>o.x-=sp*dt);coins.forEach(c=>c.x-=sp*dt);obs=obs.filter(o=>o.x>-40);
    const px=56,pw=24,ph=32;
    for(const o of obs){if(!inv&&px+pw>o.x+3&&px<o.x+o.w-3&&py>gy-o.h+4){lives--;inv=1.1;sfx.bad();info();if(lives<=0){end();return}}}
    coins=coins.filter(c=>{if(Math.abs(c.x-(px+12))<20&&Math.abs(c.y-(py-16))<24){got++;tone(1320,.08,'square',.12);info();return false}return c.x>-20});
    // 그리기
    const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#1a222b');g.addColorStop(1,'#0b0f13');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
    ctx.fillStyle='rgba(255,255,255,.06)';for(let x=-off;x<W;x+=40)ctx.fillRect(x,30,18,6);
    ctx.fillStyle=col;ctx.fillRect(0,gy,W,4);ctx.fillStyle='#262e36';ctx.fillRect(0,gy+4,W,H-gy);
    ctx.fillStyle='#ffd23f';coins.forEach(c=>{ctx.beginPath();ctx.arc(c.x,c.y,8,0,7);ctx.fill()});
    obs.forEach(o=>{ctx.fillStyle='#c9d1d6';ctx.fillRect(o.x,gy-o.h,o.w,o.h);ctx.fillStyle=col;ctx.fillRect(o.x,gy-o.h,o.w,5);ctx.fillStyle='#ff6159';ctx.fillRect(o.x+o.w/2-3,gy-o.h+10,6,6)});
    if(!(inv&&Math.floor(t*12)%2)){ctx.fillStyle='#ffbf3c';ctx.beginPath();ctx.roundRect?ctx.roundRect(px,py-ph,pw,ph,7):ctx.rect(px,py-ph,pw,ph);ctx.fill();ctx.fillStyle='#12171c';ctx.fillRect(px+14,py-ph+9,4,4);ctx.fillStyle=col;ctx.fillRect(px,py-12,pw,4)}
    raf=requestAnimationFrame(step)};
  const end=()=>{if(!alive)return;const surv=Math.round(t);stopAll();done(surv*12+got*25,surv+'초 버티고 코인 '+got+'개!')};
  cv.addEventListener('pointerdown',e=>{e.preventDefault();jump()});$('#rJ').onclick=jump;
  const rm=onKeys(e=>{if(e.code==='Space'||e.code==='ArrowUp'){if(!e.repeat)jump();return true}});
  raf=requestAnimationFrame(step);const stopT=countdown(25,$('#mgClock'),end);
  const stopAll=()=>{alive=false;cancelAnimationFrame(raf);rm();stopT()};mgStop=stopAll;

    if(sc<=0){spawn();sc=Math.max(.75,2.2-t*.035-DL()*.2)}

    stack.forEach((b,i)=>{const y=H-20-(i+1)*bh+off;if(y>H||y<-bh)return;ctx.fillStyle=i===0?'#5d676e':mix(col,'#ffffff',(i%4)*.12);ctx.fillRect(b.x,y,b.w,bh-2)});
    const cy=H-20-(stack.length+1)*bh+off;ctx.fillStyle='#ffbf3c';if(fall)ctx.fillRect(fall.x,cy+fall.y,fall.w,bh-2);else ctx.fillRect(cur.x,cy,cur.w,bh-2);
    raf=requestAnimationFrame(step)};
  cv.addEventListener('pointerdown',e=>{e.preventDefault();press()});$('#sDrop').onclick=press;
  const rm=onKeys(e=>{if(e.code==='Space'){if(!e.repeat)press();return true}});
  raf=requestAnimationFrame(step);const stop=()=>{alive=false;cancelAnimationFrame(raf);rm()};mgStop=stop;
}
function typoOf(w){const cs=[...w];for(let t=0;t<30;t++){const i=rnd(cs.length),c=cs[i].charCodeAt(0)-0xAC00;if(c<0||c>=11172)continue;
  const cho=Math.floor(c/588),jung=Math.floor(c%588/28),jong=c%28;let nj=jung,nk=jong;if(rnd(2))nj=(jung+1+rnd(3))%21;else nk=jong?0:[4,8,16,21][rnd(4)];
  const n=String.fromCharCode(0xAC00+(cho*21+nj)*28+nk);if(n!==cs[i]){cs[i]=n;return cs.join('')}}return w+'ㅋ'}

function mgSpeed(root,done){

function mgDodge(root,done){
  root.innerHTML=`<div class="mg-top"><span id="mgInfo">♥♥♥ · 코인 0</span><span class="clock" id="mgClock">25</span></div><canvas class="rn tall" id="dg"></canvas><div class="row"><button class="btn bk-btn" id="dL" type="button">◀ 왼쪽</button><button class="btn bk-btn" id="dR" type="button">오른쪽 ▶</button></div>`;
  const cv=$('#dg'),H=280,[ctx,W]=canvasSetup(cv,H),lw=W/3,lx=l=>lw*l+lw/2,col=LINES[G.line].color;
  let lane=1,px=lx(1),obs=[],t=0,sp=0,lives=3,got=0,alive=true,raf=0,lt=performance.now(),inv=0;
  const info=()=>$('#mgInfo').textContent='♥'.repeat(Math.max(0,lives))+'♡'.repeat(3-Math.max(0,lives))+' · 코인 '+got;
  const mv=d=>{lane=Math.max(0,Math.min(2,lane+d));tone(600,.04,'square',.1)};
  $('#dL').onclick=()=>mv(-1);$('#dR').onclick=()=>mv(1);
  const rm=onKeys(e=>{if(e.repeat)return false;if(e.code==='ArrowLeft'||e.code==='KeyA'){mv(-1);return true}if(e.code==='ArrowRight'||e.code==='KeyD'){mv(1);return true}});
  cv.addEventListener('pointerdown',e=>{e.preventDefault();const r=cv.getBoundingClientRect();mv(e.clientX-r.left<W/2?-1:1)});
  const end=()=>{if(!alive)return;stop();done(Math.round(t*10)+got*30,Math.round(t)+'초 버티고 코인 '+got+'개!')};
  const step=now=>{if(!alive)return;const dt=Math.min(.04,(now-lt)/1000);lt=now;t+=dt;sp-=dt;inv=Math.max(0,inv-dt);
    if(sp<=0){const coin=Math.random()<.3;obs.push({l:rnd(3),y:-30,coin});sp=Math.max(.32,.85-t*.02-DL()*.07)}
    const spd=200+t*8+DL()*30;px+=(lx(lane)-px)*Math.min(1,dt*14);
    for(const o of obs){o.y+=spd*dt;if(!o.hit&&o.l===lane&&Math.abs(o.y-(H-52))<22){o.hit=true;if(o.coin){got++;sfx.coin();info()}else if(!inv){lives--;inv=1;sfx.bad();info();if(lives<=0){end();return}}}}
    obs=obs.filter(o=>!(o.hit&&o.coin)&&o.y<H+40);
    ctx.fillStyle='#10151a';ctx.fillRect(0,0,W,H);ctx.strokeStyle='rgba(255,255,255,.12)';ctx.setLineDash([14,14]);ctx.lineDashOffset=-t*spd%28;
    for(let i=1;i<3;i++){ctx.beginPath();ctx.moveTo(lw*i,0);ctx.lineTo(lw*i,H);ctx.stroke()}ctx.setLineDash([]);
    ctx.font='28px '+EMOJI_FONT;ctx.textAlign='center';ctx.textBaseline='middle';obs.forEach(o=>{if(!o.hit||!o.coin)ctx.fillText(o.coin?'🪙':'🚧',lx(o.l),o.y)});
    if(!(inv&&Math.floor(t*12)%2)){ctx.fillStyle=col;ctx.beginPath();if(ctx.roundRect)ctx.roundRect(px-22,H-74,44,46,10);else ctx.rect(px-22,H-74,44,46);ctx.fill();ctx.fillStyle='#ffd36b';ctx.fillRect(px-16,H-66,32,10)}
    raf=requestAnimationFrame(step)};
  raf=requestAnimationFrame(step);const stopT=countdown(25,$('#mgClock'),end);
  const stop=()=>{alive=false;cancelAnimationFrame(raf);rm();stopT()};mgStop=stop;
}

function makeRaceWords(line,count){const L=LINES[line]||LINES[2];const out=[],last=[];let guard=0;while(out.length<count&&guard++<5000){const w=L.all[rnd(L.all.length)];if(last.includes(w))continue;out.push(w);last.push(w);if(last.length>10)last.shift()}return out}
function racePhrase(L){const n=L.names[rnd(L.names.length)];const P=['다음 역은 '+n+'입니다','이번 역은 '+n+'역입니다','내리실 문은 오른쪽입니다','출입문 닫습니다','안전선 밖으로 물러서 주세요','노약자석은 비워 두세요','열차가 들어오고 있습니다'];return P[rnd(P.length)]}

function makeRaceScript(line,count,opts){

  while(items.length<count){let m='normal';if(opts.rules&&b>0)m=['normal','chosung','memory','broadcast','normal'][rnd(5)];
    if(m==='broadcast'){for(let k=0;k<3&&items.length<count;k++)items.push({w:racePhrase(L),m})}
    else{const size=6+rnd(3);for(let k=0;k<size&&items.length<count;k++)items.push({w:words[i++%words.length],m})}b++}
  let n=opts.miniN!=null?+opts.miniN:(opts.mini?(count>=70?2:1):0);n=Math.max(0,Math.min(n,8,Math.floor(count/6)));
  let mini=null;if(n){const g=shuffle(RACE_MINI.slice());mini=Array.from({length:n},(_,k)=>({at:Math.max(2,Math.floor(count*(k+1)/(n+1))),game:g[k%g.length]}))}
  const events=[];if(opts.events){const n=Math.max(2,Math.round(count/9)),used=new Set();if(mini)mini.forEach(m=>used.add(m.at));
    for(let k=0;k<n;k++){let idx,t=0;do{idx=3+rnd(Math.max(1,count-4));t++}while(used.has(idx)&&t<50);used.add(idx);events.push([idx,RACE_EVENTS[rnd(RACE_EVENTS.length)]])}}

const RACE_PROMPT={chosung:'🔤 초성을 보고 이 노선의 역 이름을 쳐!',memory:'🧠 잠깐 보였다가 사라져!',broadcast:'📢 안내방송 문장을 쳐! (띄어쓰기 상관없어)'};
